
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flag It! - Results</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="results-page">

        <header class="results-header">
        <a href="index.html" class="back-link" aria-label="Back to Home">‹</a>
            <h1>Flag It!</h1>
            <span></span>
        </header>

        <div class="results-content">

            <p class="results-badge">Quiz Results</p>

            <h2>Great Job!</h2>
            <p>You completed the quiz!</p>

            <!-- Globe decoration -->
            <div class="results-globe">
                <img src="images/earth.png" alt="Planet Earth">
            </div>

            <!-- Final Score -->
            <section class="score-card">
                <h3>Your Final Score</h3>
                <p class="results-score">7 / 10</p>
                <p>70% Correct</p>
            </section>

            <!-- Correct and Incorrect -->
            <section class="results-summary">
                <div class="correct-box">
                    <strong>✓ 7 Correct</strong>
                </div>

                <div class="incorrect-box">
                    <strong>✕ 3 Incorrect</strong>
                </div>
            </section>

            <!-- Answer Summary -->
            <section class="answer-summary">
                <h3>Answer Summary</h3>

                <div class="answer-row">
                    <span>Canada</span>
                    <span class="correct">✓ Correct</span>
                </div>

                <div class="answer-row">
                    <span>Japan</span>
                    <span class="incorrect">✕ Incorrect</span>
                </div>

                <div class="answer-row">
                    <span>Brazil</span>
                    <span class="correct">✓ Correct</span>
                </div>
            </section>

            <!-- Navigation -->
            <div class="results-actions">
                <a href="modes.html" class="results-button">
                    Play Again
                </a>

                <a href="index.html" class="results-button">
                    Return Home
                </a>
            </div>

        </div>
    </main>

</body>
</html>
